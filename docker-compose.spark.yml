services:
  spark:
    build:
      context: ./spark
    image: pset2-spark-snowflake:local
    restart: "no"
    env_file:
      - .env.dbt
      - .env.snowflake
    environment:
      SPARK_LOCAL_HOSTNAME: localhost
    volumes:
      - ./secrets/snowflake_private_key.pem:/run/secrets/snowflake_private_key.pem:ro
    entrypoint: ["/opt/spark/bin/spark-submit"]
    command:
      - "--master"
      - "local[2]"
      - "--conf"
      - "spark.jars.ivy=/tmp/.ivy2"
      - "--conf"
      - "spark.sql.shuffle.partitions=4"
      - "--packages"
      - "net.snowflake:snowflake-jdbc:4.4.1,net.snowflake:spark-snowflake_2.13:3.2.3-spark_4.0"
      - "/opt/spark/work-dir/project/jobs/build_obt.py"
